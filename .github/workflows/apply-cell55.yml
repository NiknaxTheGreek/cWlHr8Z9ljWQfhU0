name: Apply approved Cell 55 summary

on:
  push:
    branches:
      - phase6-construction

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[cell55-apply]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-construction
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply approved Cell 55 edit
        run: python scripts/apply_cell55_summary.py
      - name: Verify notebook structure and target
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          nb = json.loads(Path('01_Potential_Talents_Main.ipynb').read_text())
          assert len(nb['cells']) == 58
          source = ''.join(nb['cells'][54]['source'])
          assert 'Comprehensive final NDCG summary' in source
          assert 'primary_ndcg_scorecard' not in source
          assert 'Effective actions' in source
          print('Cell 55 verification passed.')
          PY
      - name: Commit notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01_Potential_Talents_Main.ipynb
          git commit -m "[control] Apply approved Cell 55 summary table"
          git push
