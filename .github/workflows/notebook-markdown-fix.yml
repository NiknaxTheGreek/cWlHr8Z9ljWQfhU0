name: Normalize final notebook Markdown

on:
  push:
    branches:
      - phase6-construction

permissions:
  contents: write

jobs:
  normalize:
    if: contains(github.event.head_commit.message, '[notebook-format]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: phase6-construction

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Normalize notebook Markdown and approved F01/F02 cells
        run: python scripts/finalize_notebook_markdown.py

      - name: Verify notebook structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('01_Potential_Talents_Main.ipynb')
          nb = json.loads(p.read_text(encoding='utf-8'))
          assert len(nb['cells']) == 58
          for i, cell in enumerate(nb['cells'], start=1):
              if cell.get('cell_type') != 'markdown':
                  continue
              text = ''.join(cell.get('source', []))
              assert '\\(' not in text and '\\)' not in text
              assert '\\[' not in text and '\\]' not in text
              assert '\ufffd' not in text
              assert not any(0xE000 <= ord(ch) <= 0xF8FF for ch in text)
          print('58-cell notebook and Markdown-format checks passed.')
          PY

      - name: Commit normalized notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01_Potential_Talents_Main.ipynb
          if git diff --cached --quiet; then
            echo "No notebook changes required."
          else
            git commit -m "[control] Apply locked notebook Markdown formatting"
            git push
          fi
