name: Sync main notebook

on:
  push:
    branches: [phase6-construction]
    paths:
      - '.github/workflows/sync-main-notebook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-construction
          fetch-depth: 0

      - name: Materialize locked 58-cell notebook
        shell: bash
        run: |
          cat > /tmp/notebook.b64 <<'EOF'

EOF
          python - <<'PY'
          import ast, base64, gzip, hashlib, json
          from pathlib import Path

          payload = ''.join(Path('/tmp/notebook.b64').read_text().split())
          raw = gzip.decompress(base64.b64decode(payload))
          expected_sha = '4a07f4dbfde099261b85406e06ce28da974d08b31dd290dda3d39fcd09a56896'
          actual_sha = hashlib.sha256(raw).hexdigest()
          if actual_sha != expected_sha:
              raise RuntimeError(f'Notebook payload SHA mismatch: {actual_sha}')

          nb = json.loads(raw)
          if len(nb.get('cells', [])) != 58:
              raise RuntimeError('Main notebook must contain exactly 58 cells')
          for index, cell in enumerate(nb['cells'], start=1):
              source = ''.join(cell.get('source', []))
              if cell.get('cell_type') == 'code':
                  ast.parse(source)
                  if 'cache' in source.casefold():
                      raise RuntimeError(f'Executable cache reference remains in cell {index}')

          Path('01_Potential_Talents_Main.ipynb').write_bytes(raw)
          print('NOTEBOOK_SHA256=' + actual_sha)
          print('NOTEBOOK_CELL_COUNT=58')
          print('EXECUTABLE_CACHE_REFERENCES=0')
          PY

      - name: Commit notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01_Potential_Talents_Main.ipynb
          if git diff --cached --quiet; then
            echo "Notebook already synchronized."
            exit 0
          fi
          git commit -m "Sync locked 58-cell main notebook"
          git push origin HEAD:phase6-construction
