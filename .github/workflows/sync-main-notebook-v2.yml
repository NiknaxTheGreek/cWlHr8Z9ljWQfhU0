name: Sync locked main notebook

on:
  push:
    branches: [phase6-construction]
    paths:
      - '.github/workflows/sync-main-notebook-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-construction
          fetch-depth: 0
          lfs: false

      - name: Reconstruct and validate notebook
        run: |
          cat project_control/.notebook_sync/chunk0.txt \
              project_control/.notebook_sync/chunk1.txt \
              project_control/.notebook_sync/chunk2.txt \
              project_control/.notebook_sync/chunk3.txt \
              project_control/.notebook_sync/chunk4.txt > /tmp/notebook.b64
          python - <<'PY'
          import ast
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          payload = ''.join(Path('/tmp/notebook.b64').read_text().split())
          raw = gzip.decompress(base64.b64decode(payload, validate=True))
          expected_sha = '533369176bec8c80e3efdfd84e16072f8930c8b19d9bc6f8c74165790189db8a'
          actual_sha = hashlib.sha256(raw).hexdigest()
          if actual_sha != expected_sha:
              raise RuntimeError(f'Notebook SHA mismatch: {actual_sha} != {expected_sha}')

          nb = json.loads(raw)
          if len(nb.get('cells', [])) != 58:
              raise RuntimeError(f"Expected 58 cells, got {len(nb.get('cells', []))}")

          for index, cell in enumerate(nb['cells'], start=1):
              source = ''.join(cell.get('source', []))
              if cell.get('cell_type') == 'code':
                  ast.parse(source)
                  if 'cache' in source.casefold():
                      raise RuntimeError(f'Executable cache reference remains in cell {index}')

          Path('01_Potential_Talents_Main.ipynb').write_bytes(raw)
          print('NOTEBOOK_SHA256=' + actual_sha)
          print('NOTEBOOK_CELL_COUNT=58')
          print('EXECUTABLE_CACHE_REFERENCES=0')
          PY

      - name: Commit synchronized notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01_Potential_Talents_Main.ipynb
          if git diff --cached --quiet; then
            echo "Notebook already synchronized."
            exit 0
          fi
          git commit -m "Sync locked 58-cell main notebook"
          git push origin HEAD:phase6-construction
