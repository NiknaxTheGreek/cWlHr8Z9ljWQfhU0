name: Phase 4 Fresh Clone Validation

on:
  push:
    branches:
      - phase6-construction

jobs:
  fresh-clone:
    if: contains(github.event.head_commit.message, '[phase4-fresh-clone]')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone repository explicitly
        run: |
          git clone --depth 1 --branch phase6-construction https://github.com/NiknaxTheGreek/nu3sSyGg2f4gFIMy.git repo
          cd repo
          echo "fresh_clone_head=$(git rev-parse HEAD)"
          test -f requirements.txt
          test -f 01_Potential_Talents_Main.ipynb
          test -f scripts/fetch_model40.py

      - name: Install dependencies
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run test suite
        working-directory: repo
        run: pytest -q

      - name: Fetch and validate NLPL Model 40
        working-directory: repo
        run: |
          python scripts/fetch_model40.py
          test -f models/model.bin
          python - <<'PY'
          from pathlib import Path
          p = Path('models/model.bin')
          assert p.stat().st_size == 1651062031, p.stat().st_size
          print('model.bin bytes:', p.stat().st_size)
          PY

      - name: Execute reviewer notebook from fresh clone
        working-directory: repo
        run: |
          mkdir -p artifacts
          jupyter nbconvert \
            --to notebook \
            --execute 01_Potential_Talents_Main.ipynb \
            --output 01_Potential_Talents_Main.executed.ipynb \
            --output-dir artifacts \
            --ExecutePreprocessor.timeout=-1

      - name: Verify required outputs
        working-directory: repo
        run: |
          test -f outputs/final_ranking.csv
          test -f outputs/feedback_summary.csv
          test -f outputs/run_manifest.json
          test -f outputs/run.log
          test -f artifacts/01_Potential_Talents_Main.executed.ipynb

      - name: Capture fresh-clone evidence
        working-directory: repo
        run: |
          {
            echo '=== commit ==='
            git rev-parse HEAD
            echo
            echo '=== git status ==='
            git status --short
            echo
            echo '=== outputs ==='
            find outputs -maxdepth 3 -type f -print 2>/dev/null | sort || true
            echo
            echo '=== artifacts ==='
            find artifacts -maxdepth 2 -type f -print 2>/dev/null | sort || true
          } | tee artifacts/fresh_clone_file_state.txt

      - name: Upload fresh-clone evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase4-fresh-clone-evidence
          path: |
            repo/artifacts/
            repo/outputs/
          retention-days: 14
