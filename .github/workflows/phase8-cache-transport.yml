name: Phase 8 cache transport

on:
  push:
    branches: [phase6-construction]
    paths:
      - '.github/workflows/phase8-cache-transport.yml'
      - 'project_control/phase8_required_tokens.txt'

permissions:
  contents: write
  actions: read

jobs:
  promote-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-construction
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install --quiet numpy
      - name: Recover validated legacy token-vector artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10279174088/zip" \
            -o /tmp/model40-cache.zip
          mkdir -p /tmp/model40-cache
          unzip -q /tmp/model40-cache.zip -d /tmp/model40-cache
          test -f /tmp/model40-cache/model40_required_token_vectors.csv
      - name: Rebuild compact Gate-2 NPZ and update metadata
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          import numpy as np

          required = [x.strip() for x in Path('project_control/phase8_required_tokens.txt').read_text().splitlines() if x.strip()]
          required_set = set(required)
          vectors = {}
          src = Path('/tmp/model40-cache/model40_required_token_vectors.csv')
          with src.open(newline='', encoding='utf-8') as f:
              reader = csv.reader(f)
              header = next(reader)
              if len(header) != 101:
                  raise RuntimeError(f'Unexpected compact vector CSV width: {len(header)}')
              for row in reader:
                  if row and row[0] in required_set:
                      vals = np.asarray(row[1:], dtype=np.float32)
                      if vals.shape != (100,):
                          raise RuntimeError(f'Bad vector shape for {row[0]}: {vals.shape}')
                      vectors[row[0]] = vals

          cached = sorted(vectors)
          missing = sorted(required_set - set(cached))
          expected_missing = ['entry-level', 'team-focused']
          if missing != expected_missing:
              raise RuntimeError(f'Unexpected OOV tokens: {missing}')
          if len(cached) != 108:
              raise RuntimeError(f'Expected 108 cached tokens, got {len(cached)}')

          token_arr = np.asarray(cached)
          vector_arr = np.vstack([vectors[t] for t in cached]).astype(np.float32)
          out = Path('cache/model40_required_vectors.npz')
          np.savez_compressed(out, tokens=token_arr, vectors=vector_arr)
          sha = hashlib.sha256(out.read_bytes()).hexdigest()

          meta_path = Path('cache/model40_cache_metadata.json')
          meta = json.loads(meta_path.read_text())
          meta['cache_npz_sha256'] = sha
          meta['cached_token_count'] = len(cached)
          meta['required_token_count'] = len(required)
          meta['oov_required_tokens'] = missing
          meta.setdefault('provenance', {})['phase8_transport'] = {
              'method': 'temporary GitHub Actions construction transport',
              'source_artifact_id': 10279174088,
              'source_file': 'model40_required_token_vectors.csv',
              'source_file_sha256': '3bf58f006067fbb6214db607c1d3bec88d7cddf9e6bddfc0cbf55c818699f2cf'
          }
          meta_path.write_text(json.dumps(meta, indent=2, sort_keys=True) + '\n')
          print('NPZ_SHA256=' + sha)
          print('CACHED_TOKENS=' + str(len(cached)))
          print('OOV=' + ','.join(missing))
          PY
      - name: Commit validated cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cache/model40_required_vectors.npz cache/model40_cache_metadata.json
          git commit -m 'Phase 8: rebuild full validated Model 40 cache' || exit 0
          git push origin HEAD:phase6-construction
