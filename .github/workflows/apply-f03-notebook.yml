name: Apply approved feedback-depth label correction

on:
  push:
    branches:
      - phase6-construction

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[feedback-labels]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-construction
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/apply_f03_notebook_edit.py
      - name: Verify and commit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          nb = json.load(open('01_Potential_Talents_Main.ipynb', encoding='utf-8'))
          assert len(nb['cells']) == 58
          nb_text = '\n'.join(''.join(c.get('source', [])) for c in nb['cells'])
          assert 'review_pct = int(round(100 * reviewed_n / len(hr_analysis)))' not in nb_text
          assert 'review_percentage_by_k[reviewed_n]' in nb_text
          assert 'feedback_results_table["review_cutoff"].map(review_percentage_by_k)' in nb_text

          presentation = Path('src/presentation.py').read_text(encoding='utf-8')
          assert 'conceptual_review_labels' in presentation
          assert 'int(round(value * 100))' not in presentation
          print('Feedback-depth labels verified as conceptual 10%/20%/50%.')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01_Potential_Talents_Main.ipynb src/presentation.py
          git commit -m "[control] Correct conceptual feedback-depth labels"
          git push
