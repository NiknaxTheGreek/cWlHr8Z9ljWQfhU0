name: Apply approved F04 F05 notebook edit

on:
  push:
    branches:
      - phase6-construction

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[notebook-f04f05]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-construction
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply approved narratives
        run: python scripts/apply_f04_f05_narratives.py
      - name: Verify locked notebook structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          nb=json.loads(Path('01_Potential_Talents_Main.ipynb').read_text(encoding='utf-8'))
          assert len(nb['cells']) == 58
          assert '# Interpret Figure F04' in ''.join(nb['cells'][49]['source'])
          assert '# Interpret Figure F05' in ''.join(nb['cells'][51]['source'])
          print('F04/F05 notebook patch verified.')
          PY
      - name: Commit notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01_Potential_Talents_Main.ipynb
          git commit -m "[control] Apply approved F04 F05 notebook narratives"
          git push
