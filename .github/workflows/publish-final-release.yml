name: Publish approved final release

on:
  push:
    branches:
      - phase6-construction

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-final-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: phase6-construction
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download authoritative clean-run artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/final_clean_run
          mkdir -p /tmp/final_clean_run
          gh run download 35273484952 \
            --repo NiknaxTheGreek/nu3sSyGg2f4gFIMy \
            --name phase4-clean-run-evidence \
            --dir /tmp/final_clean_run
          find /tmp/final_clean_run -maxdepth 3 -type f -print | sort

      - name: Publish and verify final release artifacts
        run: python scripts/publish_final_release.py /tmp/final_clean_run

      - name: Commit exact approved release state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add -A
          git commit -m "[phase4-fresh-clone] Publish approved final release artifacts"
          git push
